# One grouped pull request per month for the Hub dependencies (transitive ones included),
# and one for the GitHub Actions used by the CI. Each pull request is tested by the CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /hub
    schedule:
      interval: monthly
    allow:
      - dependency-type: all
    # The Hub supports Node 22.13 and later: keep the Node typings on that major version,
    # so the typecheck still catches APIs that do not exist in Node 22.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      hub:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
