name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hub:
    name: Hub (tests, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  memory-template:
    name: Memory template (links, frontmatter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 memory-template/tools/ezbrain.py check
